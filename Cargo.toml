[workspace]
resolver = "2"

members = ["precis-core", "precis-profiles", "precis-tools"]
exclude = ["precis-core/fuzz", "precis-profiles/fuzz"]

# Internal crates carry both `path` (used for local development) and `version`
# (required by crates.io when publishing). Keep each `version` in sync with the
# corresponding crate's `[package] version` when bumping.
[workspace.dependencies]
precis-core = { path = "precis-core", version = "0.2.0" }
precis-profiles = { path = "precis-profiles", version = "0.1.14" }
precis-tools = { path = "precis-tools", version = "0.1.10" }
regex = "1"
reqwest = { version = "0.13", features = ["blocking"] }
ucd-parse = "0.1"
unicode-normalization = "0.1"
