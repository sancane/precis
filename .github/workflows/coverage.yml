name: coverage

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Nightly is required for doctest coverage (`--doctests`).
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # cargo-llvm-cov uses the compiler's own source-based instrumentation
      # (`-C instrument-coverage`), which is far more accurate than tarpaulin's
      # ptrace line coverage. The ignore regex mirrors the previous
      # `--exclude-files` list (the build-only precis-tools crate and the
      # test/bench sources are not measured as covered code).
      - name: Generate code coverage (including doctests)
        run: |
          cargo +nightly llvm-cov --workspace --doctests \
            --ignore-filename-regex '(precis-tools/|/tests/|/benches/)' \
            --lcov --output-path lcov.info

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
