# Configuration for cargo-deny
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    # Required by `unicode-ident` (pulled in transitively through
    # `proc-macro2`), which is dual-licensed MIT/Apache-2.0 for its code but
    # carries the Unicode-3.0 license for its generated Unicode tables.
    # Unicode-3.0 is an OSI-approved permissive license.
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
