# Codecov configuration (https://docs.codecov.com/docs/codecovyml-reference)
coverage:
  status:
    project:
      default:
        target: auto
        # Coverage is deterministic (property tests are excluded from the
        # coverage run), so require no drop at all versus the base.
        threshold: 0%
    patch:
      default:
        target: auto
        threshold: 0%

# Keep the PR comment concise.
comment:
  layout: "reach, diff, files"
  require_changes: false
